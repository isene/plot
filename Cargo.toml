[package]
name = "fe2o3-plot"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Terminal charts with Unicode and ANSI colors. Sparklines, line, candlestick, and bar charts."
license = "Unlicense"
repository = "https://github.com/isene/plot"
keywords = ["terminal", "chart", "sparkline", "tui", "unicode"]
categories = ["command-line-interface", "visualization"]

[lib]
name = "plot"

[dependencies]
# Pinned: the ANSI helpers used here landed in 0.1.43, so a publish
# must fail loudly until that version is on crates.io.
crust = { version = "0.1.43", path = "../crust", package = "fe2o3-crust" }
