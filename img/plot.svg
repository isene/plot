<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes grow { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
    @keyframes draw { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    .bar { animation: grow 1.5s ease-out forwards; transform-origin: bottom; }
    .line { animation: draw 2s ease-in-out infinite; stroke-dasharray: 200; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>
  <!-- Chart axes -->
  <line x1="55" y1="45" x2="55" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="55" y1="160" x2="200" y2="160" stroke="#888" stroke-width="1.5"/>
  <!-- Y-axis ticks -->
  <line x1="52" y1="70" x2="55" y2="70" stroke="#888" stroke-width="1"/>
  <line x1="52" y1="100" x2="55" y2="100" stroke="#888" stroke-width="1"/>
  <line x1="52" y1="130" x2="55" y2="130" stroke="#888" stroke-width="1"/>
  <!-- Grid lines (subtle) -->
  <line x1="55" y1="70" x2="200" y2="70" stroke="#333" stroke-width="0.5"/>
  <line x1="55" y1="100" x2="200" y2="100" stroke="#333" stroke-width="0.5"/>
  <line x1="55" y1="130" x2="200" y2="130" stroke="#333" stroke-width="0.5"/>
  <!-- Bars -->
  <rect class="bar" x="65" y="90" width="16" height="70" rx="2" fill="#f74c00" opacity="0.8" style="animation-delay:0s"/>
  <rect class="bar" x="90" y="60" width="16" height="100" rx="2" fill="#4c4" opacity="0.8" style="animation-delay:0.2s"/>
  <rect class="bar" x="115" y="105" width="16" height="55" rx="2" fill="#51afef" opacity="0.8" style="animation-delay:0.4s"/>
  <rect class="bar" x="140" y="50" width="16" height="110" rx="2" fill="#e2b714" opacity="0.8" style="animation-delay:0.6s"/>
  <rect class="bar" x="165" y="80" width="16" height="80" rx="2" fill="#a8e" opacity="0.8" style="animation-delay:0.8s"/>
  <!-- Line chart overlay -->
  <polyline class="line" points="73,90 98,60 123,105 148,50 173,80" fill="none" stroke="#f74c00" stroke-width="2"/>
  <!-- Data points -->
  <circle cx="73" cy="90" r="3" fill="#f74c00"/>
  <circle cx="98" cy="60" r="3" fill="#f74c00"/>
  <circle cx="123" cy="105" r="3" fill="#f74c00"/>
  <circle cx="148" cy="50" r="3" fill="#f74c00"/>
  <circle cx="173" cy="80" r="3" fill="#f74c00"/>
  <text x="128" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="3">plot</text>
  <text x="128" y="221" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">terminal charts</text>
</svg>
